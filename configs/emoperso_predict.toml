# Configure data and devices; model resources must already be cached or local.
output_dir = "../runs/predict"
[data]
inference = "../local/unlabelled.jsonl"
dataset_id = "my_dataset"
layout = "users"
preprocess = true
order = "source"
[data.text]
max_posts = 64
max_post_chars = 4096
max_user_chars = 65536
[tokenizer]
tokenizer_name_or_path = "deepseek-ai/DeepSeek-V3"
revision = "e815299b0bcbac849fa540c768ef21845365c9eb"
local_files_only = true
max_length = 2048
[model]
shared_hidden_size = 4096
shared_device = "cuda:0"
backbone_id = "deepseek-ai/DeepSeek-V3@e815299b0bcbac849fa540c768ef21845365c9eb"
[model.backbone]
model_name_or_path = "deepseek-ai/DeepSeek-V3"
revision = "e815299b0bcbac849fa540c768ef21845365c9eb"
local_files_only = true
device_map = "auto"
dtype = "bfloat16"
# Runtime settings shared with training.
[training]
batch_size = 1
seed = 42
precision = "bf16"
[views]
# Match the checkpoint's style categories and model structure.
augmentation = "both"
reasoning = true
policy = "reuse"
cache_dir = "../local/private_generated_text"
candidate_microbatch = 1
[views.generator]
model_name_or_path = "deepseek-ai/DeepSeek-V3"
revision = "e815299b0bcbac849fa540c768ef21845365c9eb"
local_files_only = true
device_map = "auto"
dtype = "bfloat16"
top_p = 0.9
temperature = 1.0
max_new_tokens = 512
max_prompt_tokens = 2048
