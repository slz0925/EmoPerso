# Configure your data, tokenizer, weights and devices before running.
output_dir = "../runs/train"
# seeds = [42, 43, 44]  # Optional independent runs.
[data]
train = "../local/train.jsonl"
validation = "../local/validation.jsonl"
test = "../local/test.jsonl"
inference = "../local/unlabelled.jsonl"
dataset_id = "my_dataset"
layout = "users"
preprocess = true
order = "source"
[data.text]
max_posts = 64
max_post_chars = 4096
max_user_chars = 65536
[tokenizer]
tokenizer_name_or_path = "../local/deepseek-v3-tokenizer"
local_files_only = true
max_length = 2048
[model]
shared_hidden_size = 4096
shared_device = "cuda:0"
backbone_id = "my-frozen-deepseek-v3-checkpoint-version"
[model.backbone]
model_name_or_path = "../local/deepseek-v3"
local_files_only = true
device_map = "auto"
dtype = "bfloat16"
[training]
batch_size = 1
max_epochs = 20
seed = 42
optimizer = "adam"
learning_rate = 0.001
weight_decay = 0.0
gradient_accumulation_steps = 8
gradient_clip_norm = 1.0
scheduler = "constant"
precision = "bf16"
validation_frequency = 1
patience = 5
[views]
augmentation = "both"
reasoning = true
policy = "reuse"
cache_dir = "../local/private_generated_text"
candidate_microbatch = 1
[views.generator]
model_name_or_path = "../local/generation-model"
local_files_only = true
device_map = "auto"
dtype = "bfloat16"
top_p = 0.9
temperature = 1.0
max_new_tokens = 512
max_prompt_tokens = 2048
